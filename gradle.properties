# FM1 DECK Gradle settings (proven with AGP 9.4.1 / Gradle 9.7.1).
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Sequential builds avoid Gradle daemon contention (one Gradle process at a time)
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
android.nonTransitiveRClass=true
# Lets the build work from a path that contains a space (AGP refuses such paths without this).
android.overridePathCheck=true
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC

# FM1 DECK switches (override per build with -P...):
#   fm1deckAbis=arm64-v8a            build one ABI for a quick phone check (default: arm64-v8a,x86_64)
#   fm1deckBuiltinFw=true            build the firmware modules (fwbuild/) into the APK (needs build/fwgen/<id>/gen)
#   fm1deckDspProfile=true           native DSP stage profiler, logcat tag FM1_PROF
