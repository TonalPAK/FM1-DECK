name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          gradle_version=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          if [ "$version" != "$gradle_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName \"$gradle_version\" in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Section "## <version> ..." up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::No section for $VERSION in CHANGELOG.md"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system generator and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfribidi0 libraqm0 ninja-build

      - name: Install Python dependencies
        run: |
          pip install pillow numpy fonttools
          python3 -c "import PIL.features; assert PIL.features.check('raqm'), 'raqm not available in PIL'"

      - name: Generate firmware headers
        run: python3 tools/fwgen/fwgen.py all

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK and run host unit tests
        run: ./gradlew test assembleRelease -Pfm1deckAbis=arm64-v8a --no-daemon

      - name: Verify signature and rename APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::$src not found (unsigned build produces app-release-unsigned.apk)"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner
          "$apksigner" verify --print-certs "$src" | grep -E 'certificate (DN|SHA-256)'
          out="FM1-DECK-${VERSION}-arm64.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FM1 DECK $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
