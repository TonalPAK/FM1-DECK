name: Android CI

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system generator and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfribidi0 libraqm0 ninja-build

      - name: Install Python dependencies
        run: |
          pip install pillow numpy fonttools
          python3 -c "import PIL.features; assert PIL.features.check('raqm'), 'raqm not available in PIL'"

      - name: Generate firmware headers
        run: python3 tools/fwgen/fwgen.py all

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK and run host unit tests
        run: ./gradlew assembleDebug test --no-daemon

      - name: Build and run native host tests (CTest + ASan)
        run: |
          cmake -S native-tests -B build/native-tests -DCMAKE_BUILD_TYPE=Debug -DFM1DECK_ASAN=ON -G Ninja
          cmake --build build/native-tests
          ctest --test-dir build/native-tests --output-on-failure

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
